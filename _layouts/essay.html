---
layout: default
---

<!-- 1. Author & Acknowledgement Block -->
<div style="margin-bottom: 2em; padding-bottom: 1em; border-bottom: 1px solid #333;">
  
  <div style="font-style: italic;">
    <a href="{{ page.author_url | default: 'https://www.imsc.res.in/partha_mukhopadhyay' }}">
      {{ page.author | default: 'Partha Mukhopadhyay' }}
    </a>
  </div>

  {% if page.acknowledgement %}
    <div style="font-size: 0.9em; color: #888; margin-top: 0.5em;">
      {{ page.acknowledgement }}
    </div>
  {% endif %}

</div>

<!-- 2. The Main Markdown Content -->
{{ content }}

<!-- 3. Left/Right Flushed Footer -->
<div style="display: flex; justify-content: space-between; margin-top: 3em; padding-top: 1em; border-top: 1px solid #333; font-size: 0.9em; color: #888;">
  
  <div>
    {% if page.created %}<strong>Created:</strong> {{ page.created }}{% endif %}
  </div>
  
  <div>
    {% if page.lastUpdated %}<strong>Last Updated:</strong> {{ page.lastUpdated }}{% endif %}
  </div>

</div>

<!-- 4. Mermaid Rendering Script (Fixed Dark Theme & Colors) -->
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
  
  mermaid.initialize({ 
    startOnLoad: false, 
    theme: 'base',
    themeVariables: {
      darkMode: true,
      background: '#1E1E1E',
      primaryColor: '#151515',
      lineColor: '#888888',
      textColor: '#e8e8e8'
    }
  });

document.addEventListener("DOMContentLoaded", async function() {
    const elements = document.querySelectorAll('.language-mermaid');
    
    elements.forEach((el) => {
      const div = document.createElement("div");
      div.className = "mermaid";
      
      // Intercept and swap the hex codes dynamically for the web
      let diagramText = el.textContent;
      diagramText = diagramText.replace(/fill:#e8eef7/g, 'fill:#1D263B'); // root box
      diagramText = diagramText.replace(/fill:#eef3ec/g, 'fill:#1F291E'); // surface box
      diagramText = diagramText.replace(/fill:#f7efe8/g, 'fill:#36261A'); // human box
      diagramText = diagramText.replace(/color:#1a2a44/g, 'color:#e8e8e8'); // root text
      diagramText = diagramText.replace(/color:#1e2e1a/g, 'color:#e8e8e8'); // surface text
      diagramText = diagramText.replace(/color:#442e1a/g, 'color:#e8e8e8'); // human text
      
      div.textContent = diagramText;
      el.replaceWith(div);
    });
    
    await mermaid.run();
  });
</script>
