---
layout: default
---

<!-- 1. Author & Acknowledgement Block -->
<div style="margin-bottom: 2em; padding-bottom: 1em; border-bottom: 1px solid #333;">
  
  <div style="font-style: italic;">
    <a href="{{ page.author_url | default: 'https://www.imsc.res.in/partha_mukhopadhyay' }}">
      {{ page.author | default: 'Partha Mukhopadhyay' }}
    </a>
  </div>

  {% if page.acknowledgement %}
    <div style="font-size: 0.9em; color: #888; margin-top: 0.5em;">
      {{ page.acknowledgement }}
    </div>
  {% endif %}

</div>

<!-- 2. The Main Markdown Content -->
{{ content }}

<!-- 3. Left/Right Flushed Footer -->
<div style="display: flex; justify-content: space-between; margin-top: 3em; padding-top: 1em; border-top: 1px solid #333; font-size: 0.9em; color: #888;">
  
  <div>
    {% if page.created %}<strong>Created:</strong> {{ page.created }}{% endif %}
  </div>
  
  <div>
    {% if page.lastUpdated %}<strong>Last Updated:</strong> {{ page.lastUpdated }}{% endif %}
  </div>

</div>

<!-- Kept external because Just the Docs compresses inline scripts. -->
<script type="module" src="{{ '/assets/js/mermaid-init.js' | relative_url }}"></script>
